version: '3.9'

services:
  backend:
    build: ./backend
    container_name: ac-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ac-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped